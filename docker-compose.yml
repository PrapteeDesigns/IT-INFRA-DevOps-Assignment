services:

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - webnet

  backend:
    build: ./app
    container_name: backend
    expose:
      - "5000"
    depends_on:
      - db
    networks:
      - webnet
      - dbnet

  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dbnet

volumes:
  postgres_data:

networks:
  webnet:
  dbnet:
